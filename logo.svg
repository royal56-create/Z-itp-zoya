<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Neon Glow Filter -->
    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="14" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Metallic Silver Gradient -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="75%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- Bold Red Gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF4D4D" />
      <stop offset="40%" stop-color="#E10600" />
      <stop offset="100%" stop-color="#8B0000" />
    </linearGradient>

    <!-- Dark Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#140202" />
      <stop offset="70%" stop-color="#080202" />
      <stop offset="100%" stop-color="#020000" />
    </radialGradient>

    <!-- Clip Path for Circular Badge -->
    <clipPath id="circleClip">
      <circle cx="256" cy="256" r="240" />
    </clipPath>
  </defs>

  <!-- Base Black Background -->
  <rect width="512" height="512" fill="#050505" />

  <!-- Main Circular Badge Body -->
  <g clip-path="url(#circleClip)">
    <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" />

    <!-- Cyberpunk City Skyline in Background -->
    <g opacity="0.35" fill="#E10600">
      <!-- Far background buildings -->
      <rect x="80" y="110" width="28" height="260" opacity="0.4" />
      <polygon points="80,110 94,80 108,110" opacity="0.4" />
      <rect x="115" y="130" width="32" height="240" opacity="0.5" />
      <rect x="155" y="90" width="36" height="280" opacity="0.6" />
      <polygon points="155,90 173,60 191,90" opacity="0.6" />
      <line x1="173" y1="60" x2="173" y2="40" stroke="#FF4D4D" stroke-width="2" />
      
      <rect x="198" y="140" width="26" height="230" opacity="0.4" />
      <rect x="290" y="130" width="28" height="240" opacity="0.4" />
      <rect x="325" y="85" width="38" height="285" opacity="0.6" />
      <polygon points="325,85 344,55 363,85" opacity="0.6" />
      <line x1="344" y1="55" x2="344" y2="35" stroke="#FF4D4D" stroke-width="2" />
      
      <rect x="370" y="120" width="30" height="250" opacity="0.5" />
      <rect x="405" y="100" width="26" height="270" opacity="0.4" />
      <polygon points="405,100 418,75 431,100" opacity="0.4" />

      <!-- Building Windows Grid Patterns -->
      <g opacity="0.7" stroke="#FF3333" stroke-width="1.5" stroke-dasharray="3,4">
        <line x1="162" y1="110" x2="162" y2="280" />
        <line x1="172" y1="110" x2="172" y2="280" />
        <line x1="182" y1="110" x2="182" y2="280" />
        <line x1="334" y1="105" x2="334" y2="280" />
        <line x1="344" y1="105" x2="344" y2="280" />
        <line x1="354" y1="105" x2="354" y2="280" />
        <line x1="123" y1="150" x2="123" y2="280" />
        <line x1="138" y1="150" x2="138" y2="280" />
        <line x1="378" y1="140" x2="378" y2="280" />
        <line x1="390" y1="140" x2="390" y2="280" />
      </g>
    </g>

    <!-- Cyber Circuit Tech Traces - Left & Right -->
    <g stroke="#E10600" stroke-width="2.5" fill="none" opacity="0.75" filter="url(#redGlow)">
      <!-- Left Circuit Lines -->
      <path d="M 40 200 H 90 L 115 225 V 270 L 95 290 H 50" />
      <circle cx="40" cy="200" r="3.5" fill="#FF4D4D" />
      <circle cx="50" cy="290" r="3.5" fill="#FF4D4D" />
      <path d="M 30 240 H 75 L 95 260 H 130" />
      <circle cx="30" cy="240" r="3" fill="#FF4D4D" />
      <circle cx="130" cy="260" r="3" fill="#FF4D4D" />
      <path d="M 60 320 H 100 L 125 345 V 390" />
      <circle cx="60" cy="320" r="3" fill="#FF4D4D" />

      <!-- Right Circuit Lines -->
      <path d="M 472 200 H 422 L 397 225 V 270 L 417 290 H 462" />
      <circle cx="472" cy="200" r="3.5" fill="#FF4D4D" />
      <circle cx="462" cy="290" r="3.5" fill="#FF4D4D" />
      <path d="M 482 240 H 437 L 417 260 H 382" />
      <circle cx="482" cy="240" r="3" fill="#FF4D4D" />
      <circle cx="382" cy="260" r="3" fill="#FF4D4D" />
      <path d="M 452 320 H 412 L 387 345 V 390" />
      <circle cx="452" cy="320" r="3" fill="#FF4D4D" />
    </g>

    <!-- Top Tech Header Ornament -->
    <g stroke="#E10600" stroke-width="1.8" fill="none" opacity="0.8">
      <path d="M 210 38 H 245 L 256 49 L 267 38 H 302" />
      <line x1="256" y1="26" x2="256" y2="49" />
      <circle cx="256" cy="26" r="2.5" fill="#E10600" />
      <circle cx="210" cy="38" r="2" fill="#E10600" />
      <circle cx="302" cy="38" r="2" fill="#E10600" />
    </g>

    <!-- Top Typography: ROYAL / ANKIT / AHIRAN -->
    <text x="256" y="66" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="900" font-size="21" letter-spacing="7" fill="url(#silverGrad)">
      ROYAL
    </text>
    <text x="256" y="103" text-anchor="middle" font-family="'Archivo Black', 'Arial Black', sans-serif" font-weight="900" font-size="37" letter-spacing="4" fill="url(#redGrad)" filter="url(#redGlow)">
      ANKIT
    </text>
    <text x="256" y="125" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="800" font-size="16" letter-spacing="6" fill="#E10600">
      AHIRAN
    </text>

    <!-- Central Silhouetted Hacker/Detective in Fedora & Trench Coat (Back View) -->
    <g id="figure" transform="translate(0, 5)">
      <!-- Trench Coat Back Body -->
      <path d="M 172 385 L 188 280 L 210 245 L 228 220 L 256 215 L 284 220 L 302 245 L 324 280 L 340 385 Z" fill="#0C0C0E" stroke="#E10600" stroke-width="2" />
      
      <!-- Coat Collar & Shoulders -->
      <path d="M 188 280 L 218 245 L 256 252 L 294 245 L 324 280 L 305 292 L 256 280 L 207 292 Z" fill="#141418" stroke="#FF3333" stroke-width="1.5" />
      <path d="M 218 245 L 235 205 L 256 215 L 277 205 L 294 245 Z" fill="#0E0E12" stroke="#E10600" stroke-width="1.5" />

      <!-- Fedora Hat (Seen from behind) -->
      <!-- Crown of hat -->
      <path d="M 218 190 C 218 150, 294 150, 294 190 Z" fill="#08080A" stroke="#E10600" stroke-width="2" />
      <ellipse cx="256" cy="188" rx="38" ry="8" fill="#1A0404" stroke="#FF3333" stroke-width="1.5" />
      <!-- Hat Brim -->
      <ellipse cx="256" cy="192" rx="64" ry="16" fill="#0A0A0C" stroke="#E10600" stroke-width="2.5" />
      <!-- Red Ambient Edge Glow on Hat -->
      <path d="M 198 192 C 220 204, 292 204, 314 192" stroke="#FF4D4D" stroke-width="2.5" fill="none" opacity="0.8" />

      <!-- Crown Emblem on Back of Coat -->
      <g transform="translate(256, 275) scale(0.75)" stroke="url(#silverGrad)" fill="url(#silverGrad)">
        <path d="M -26 0 L -32 -22 L -14 -10 L 0 -28 L 14 -10 L 32 -22 L 26 0 Z" />
        <rect x="-24" y="3" width="48" height="4" rx="2" fill="url(#silverGrad)" />
      </g>

      <!-- Metallic Chrome "RAA" Monogram on Back of Coat -->
      <g transform="translate(256, 332)" text-anchor="middle">
        <text x="0" y="0" font-family="'Archivo Black', 'Arial Black', sans-serif" font-weight="900" font-size="44" letter-spacing="3" fill="url(#silverGrad)" stroke="#1E293B" stroke-width="1.5" filter="drop-shadow(0px 4px 8px rgba(0,0,0,0.9))">
          RAA
        </text>
      </g>
    </g>

    <!-- Security Tech HUD Terminal Overlays (Bottom Left & Right) -->
    <g opacity="0.65" stroke="#E10600" stroke-width="1.5" fill="none">
      <!-- Left Terminal Box -->
      <rect x="65" y="330" width="70" height="52" rx="5" fill="#0A0202" />
      <line x1="72" y1="342" x2="115" y2="342" stroke-width="2" />
      <line x1="72" y1="350" x2="125" y2="350" stroke-dasharray="3,3" />
      <line x1="72" y1="358" x2="105" y2="358" stroke-dasharray="4,2" />
      <line x1="72" y1="366" x2="120" y2="366" />
      <circle cx="123" cy="372" r="3" fill="#E10600" />

      <!-- Right Radar HUD Box -->
      <rect x="377" y="330" width="70" height="52" rx="5" fill="#0A0202" />
      <circle cx="412" cy="356" r="18" />
      <circle cx="412" cy="356" r="10" stroke-dasharray="2,3" />
      <circle cx="412" cy="356" r="3" fill="#E10600" />
      <line x1="412" y1="338" x2="412" y2="374" stroke-width="1" />
      <line x1="394" y1="356" x2="430" y2="356" stroke-width="1" />
    </g>

    <!-- Bottom Tech Plaque / Banner -->
    <g transform="translate(0, 395)">
      <!-- Lock Icon Indicator -->
      <g transform="translate(256, -8)">
        <rect x="-8" y="0" width="16" height="13" rx="2" fill="#E10600" />
        <path d="M -5 0 V -5 C -5 -8, 5 -8, 5 -5 V 0" stroke="#FF4D4D" stroke-width="2.2" fill="none" />
        <circle cx="0" cy="6" r="1.8" fill="#FFFFFF" />
      </g>

      <!-- Plaque Body -->
      <path d="M 125 15 L 145 0 H 367 L 387 15 V 56 L 367 70 H 145 L 125 56 Z" fill="#0A0A0C" stroke="#E10600" stroke-width="2.5" />
      <path d="M 135 18 L 149 6 H 363 L 377 18 V 53 L 363 64 H 149 L 135 53 Z" fill="#121216" stroke="#5C0A08" stroke-width="1.5" />

      <!-- Banner Text: ROYAL ANKIT AHIRAN -->
      <text x="256" y="38" text-anchor="middle" font-family="'Archivo Black', 'Inter', sans-serif" font-weight="900" font-size="18.5" letter-spacing="3" fill="url(#silverGrad)">
        ROYAL ANKIT AHIRAN
      </text>

      <!-- 4 Tech Icons at Bottom of Banner (Globe, Database, User, Folder) -->
      <g transform="translate(182, 53)" stroke="#E10600" stroke-width="1.5" fill="none" opacity="0.9">
        <!-- Globe -->
        <circle cx="0" cy="0" r="6.5" />
        <ellipse cx="0" cy="0" rx="3" ry="6.5" />
        <line x1="-6.5" y1="0" x2="6.5" y2="0" />

        <!-- Database -->
        <g transform="translate(49, 0)">
          <ellipse cx="0" cy="-4" rx="6" ry="2.2" />
          <path d="M -6 -4 V 4 C -6 5.5, 6 5.5, 6 4 V -4" />
          <path d="M -6 0 C -6 1.5, 6 1.5, 6 0" />
        </g>

        <!-- User / Person -->
        <g transform="translate(98, 0)">
          <circle cx="0" cy="-3.5" r="3.2" />
          <path d="M -6 5 C -6 1.5, 6 1.5, 6 5" />
        </g>

        <!-- Folder -->
        <g transform="translate(148, 0)">
          <path d="M -6.5 -4 H -2 L 0 -1.5 H 6.5 V 4.5 H -6.5 Z" />
        </g>
      </g>
    </g>
  </g>

  <!-- Glowing Red Neon Outer Ring Border -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#E10600" stroke-width="9" filter="url(#redGlow)" />
  <circle cx="256" cy="256" r="240" fill="none" stroke="#FF4D4D" stroke-width="3" />
  <circle cx="256" cy="256" r="248" fill="none" stroke="#E10600" stroke-width="1.5" opacity="0.6" />
</svg>
